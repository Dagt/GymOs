name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Test backend
        id: backend-test
        shell: bash
        run: |
          chmod +x gradlew
          if ! ./gradlew test --no-daemon --console=plain > /tmp/backend-unit.log 2>&1; then
            tail -n 160 /tmp/backend-unit.log
            exit 1
          fi
      - name: Test PostgreSQL integration
        id: backend-postgres-test
        shell: bash
        run: |
          if ! ./gradlew postgresIntegrationTest --no-daemon --console=plain > /tmp/backend-postgres.log 2>&1; then
            tail -n 200 /tmp/backend-postgres.log
            exit 1
          fi
      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            /tmp/backend-unit.log
            /tmp/backend-postgres.log
            backend/build/test-results/test
            backend/build/reports/tests/test
            backend/build/test-results/postgresIntegrationTest
            backend/build/reports/tests/postgresIntegrationTest
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit high severity dependencies
        shell: bash
        run: |
          if ! npm audit --audit-level=high > /tmp/frontend-audit.log 2>&1; then
            tail -n 160 /tmp/frontend-audit.log
            exit 1
          fi
      - name: Test
        run: npm test
      - name: Lint
        shell: bash
        run: |
          if ! npm run lint > /tmp/frontend-lint.log 2>&1; then
            tail -n 120 /tmp/frontend-lint.log
            exit 1
          fi
      - name: Typecheck
        shell: bash
        run: |
          if ! npm run typecheck > /tmp/frontend-typecheck.log 2>&1; then
            tail -n 120 /tmp/frontend-typecheck.log
            exit 1
          fi
      - name: Build
        shell: bash
        run: |
          if ! npm run build > /tmp/frontend-build.log 2>&1; then
            tail -n 120 /tmp/frontend-build.log
            exit 1
          fi
      - name: Build Cloudflare bundle
        shell: bash
        run: |
          if ! npm run cf:build > /tmp/frontend-cloudflare-build.log 2>&1; then
            tail -n 160 /tmp/frontend-cloudflare-build.log
            exit 1
          fi
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test browser workflows
        shell: bash
        run: |
          if ! npm run test:e2e -- --workers=2 > /tmp/frontend-playwright.log 2>&1; then
            tail -n 180 /tmp/frontend-playwright.log
            exit 1
          fi
      - name: Upload frontend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: |
            /tmp/frontend-lint.log
            /tmp/frontend-typecheck.log
            /tmp/frontend-build.log
            /tmp/frontend-cloudflare-build.log
            /tmp/frontend-audit.log
            /tmp/frontend-playwright.log
            frontend/test-results
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Validate Docker Compose
        run: docker compose -f infra/docker-compose.yml --profile stripe config
      - name: Verify Stripe CLI image
        run: |
          docker pull stripe/stripe-cli:v1.50.3
          docker run --rm stripe/stripe-cli:v1.50.3 version
      - name: Build Docker images
        run: docker compose -f infra/docker-compose.yml build
