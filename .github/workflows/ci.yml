name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: Test backend
        id: backend-test
        shell: bash
        run: |
          if ! ./gradlew test --no-daemon --console=plain > /tmp/backend.log 2>&1; then
            tail -n 160 /tmp/backend.log
            exit 1
          fi
      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: /tmp/backend.log
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        shell: bash
        run: |
          if ! npm run lint > /tmp/frontend-lint.log 2>&1; then
            tail -n 120 /tmp/frontend-lint.log
            exit 1
          fi
      - name: Typecheck
        shell: bash
        run: |
          if ! npm run typecheck > /tmp/frontend-typecheck.log 2>&1; then
            tail -n 120 /tmp/frontend-typecheck.log
            exit 1
          fi
      - name: Build
        shell: bash
        run: |
          if ! npm run build > /tmp/frontend-build.log 2>&1; then
            tail -n 120 /tmp/frontend-build.log
            exit 1
          fi
      - name: Upload frontend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: |
            /tmp/frontend-lint.log
            /tmp/frontend-typecheck.log
            /tmp/frontend-build.log
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Validate Docker Compose
        run: docker compose -f infra/docker-compose.yml config
      - name: Build Docker images
        run: docker compose -f infra/docker-compose.yml build
