name: gymos

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gymos
      POSTGRES_USER: gymos
      POSTGRES_PASSWORD: gymos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymos -d gymos"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gymos
      MINIO_ROOT_PASSWORD: gymos-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      GYMOS_DB_URL: jdbc:postgresql://postgres:5432/gymos
      GYMOS_DB_USERNAME: gymos
      GYMOS_DB_PASSWORD: gymos
      GYMOS_REDIS_HOST: redis
      GYMOS_REDIS_PORT: 6379
      GYMOS_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  minio-data:
