name: gymos

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gymos
      POSTGRES_USER: gymos
      POSTGRES_PASSWORD: gymos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymos -d gymos"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gymos
      MINIO_ROOT_PASSWORD: gymos-secret
    ports:
      - "9020:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      GYMOS_DB_URL: jdbc:postgresql://postgres:5432/gymos
      GYMOS_DB_USERNAME: gymos
      GYMOS_DB_PASSWORD: gymos
      GYMOS_REDIS_HOST: redis
      GYMOS_REDIS_PORT: 6379
      GYMOS_CORS_ALLOWED_ORIGINS: http://localhost:3000
      GYMOS_MINIO_ENDPOINT: http://minio:9000
      GYMOS_MINIO_ACCESS_KEY: gymos
      GYMOS_MINIO_SECRET_KEY: gymos-secret
      GYMOS_MINIO_BUCKET: gymos-receipts
      GYMOS_SEED_ENABLED: ${GYMOS_SEED_ENABLED:-false}
      GYMOS_DEMO_OWNER_EMAIL: ${GYMOS_DEMO_OWNER_EMAIL:-}
      GYMOS_DEMO_OWNER_PASSWORD: ${GYMOS_DEMO_OWNER_PASSWORD:-}
      GYMOS_PLATFORM_BOOTSTRAP_ENABLED: ${GYMOS_PLATFORM_BOOTSTRAP_ENABLED:-false}
      GYMOS_PLATFORM_ADMIN_EMAIL: ${GYMOS_PLATFORM_ADMIN_EMAIL:-}
      GYMOS_PLATFORM_ADMIN_PASSWORD: ${GYMOS_PLATFORM_ADMIN_PASSWORD:-}
      GYMOS_PLATFORM_ADMIN_NAME: ${GYMOS_PLATFORM_ADMIN_NAME:-}
      GYMOS_PAYMENT_CREDENTIAL_KEY: ${GYMOS_PAYMENT_CREDENTIAL_KEY:-dev-only-payment-credential-key-change-in-production}
      GYMOS_FRONTEND_BASE_URL: ${GYMOS_FRONTEND_BASE_URL:-http://localhost:3000}
      GYMOS_STRIPE_SECRET_KEY: ${GYMOS_STRIPE_SECRET_KEY:-}
      GYMOS_STRIPE_WEBHOOK_SECRET: ${GYMOS_STRIPE_WEBHOOK_SECRET:-}
      GYMOS_STRIPE_RETURN_URL: ${GYMOS_STRIPE_RETURN_URL:-http://localhost:3000/settings/organization?payment=stripe-return}
      GYMOS_STRIPE_REFRESH_URL: ${GYMOS_STRIPE_REFRESH_URL:-http://localhost:3000/settings/organization?payment=stripe-refresh}
      GYMOS_NOTIFICATION_PREFERENCE_KEY: ${GYMOS_NOTIFICATION_PREFERENCE_KEY:-local-notification-preference-key-change-outside-development}
      GYMOS_SMTP_ENABLED: ${GYMOS_SMTP_ENABLED:-false}
      GYMOS_SMTP_PROVIDER_NAME: ${GYMOS_SMTP_PROVIDER_NAME:-Zoho Mail}
      GYMOS_SMTP_HOST: ${GYMOS_SMTP_HOST:-}
      GYMOS_SMTP_PORT: ${GYMOS_SMTP_PORT:-587}
      GYMOS_SMTP_USERNAME: ${GYMOS_SMTP_USERNAME:-}
      GYMOS_SMTP_PASSWORD: ${GYMOS_SMTP_PASSWORD:-}
      GYMOS_SMTP_ALLOWED_FROM_ADDRESSES: ${GYMOS_SMTP_ALLOWED_FROM_ADDRESSES:-}
      GYMOS_SMTP_AUTH: ${GYMOS_SMTP_AUTH:-true}
      GYMOS_SMTP_STARTTLS: ${GYMOS_SMTP_STARTTLS:-true}
      GYMOS_SMTP_STARTTLS_REQUIRED: ${GYMOS_SMTP_STARTTLS_REQUIRED:-true}
      GYMOS_SMTP_SSL: ${GYMOS_SMTP_SSL:-false}
      GYMOS_SMTP_CHECK_SERVER_IDENTITY: ${GYMOS_SMTP_CHECK_SERVER_IDENTITY:-true}
      GYMOS_SMTP_CONNECTION_TIMEOUT_MS: ${GYMOS_SMTP_CONNECTION_TIMEOUT_MS:-10000}
      GYMOS_SMTP_READ_TIMEOUT_MS: ${GYMOS_SMTP_READ_TIMEOUT_MS:-10000}
      GYMOS_SMTP_WRITE_TIMEOUT_MS: ${GYMOS_SMTP_WRITE_TIMEOUT_MS:-10000}
    ports:
      - "8080:8080"
    mem_limit: 2048m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      GYMOS_INTERNAL_API_BASE_URL: http://backend:8080/api/v1
      NODE_OPTIONS: --max-old-space-size=1536
    ports:
      - "3000:3000"
    volumes:
      - ../frontend/public/tenants:/app/public/tenants
    mem_limit: 2048m
    depends_on:
      - backend

  stripe-listener:
    image: stripe/stripe-cli:v1.50.3
    profiles: ["stripe"]
    command:
      - listen
      - --api-key
      - ${GYMOS_STRIPE_SECRET_KEY:-}
      - --events
      - checkout.session.completed,checkout.session.async_payment_succeeded,payment_intent.succeeded,payment_intent.payment_failed
      - --forward-connect-to
      - http://backend:8080/api/v1/payment-webhooks/stripe
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
