spring:
  application:
    name: GymOS
  datasource:
    url: ${GYMOS_DB_URL:jdbc:postgresql://localhost:5432/gymos}
    username: ${GYMOS_DB_USERNAME:gymos}
    password: ${GYMOS_DB_PASSWORD:gymos}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${GYMOS_REDIS_HOST:localhost}
      port: ${GYMOS_REDIS_PORT:6379}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

gymos:
  security:
    cors-allowed-origins: ${GYMOS_CORS_ALLOWED_ORIGINS:http://localhost:3000}
