# GymFort Cloud. No escribas secretos en este archivo.
cloud.baseUrl=http://localhost:8080
connector.key=access-centro-01
connector.provider=SIMULATOR
connector.instanceId=centro-local-01
connector.stateDirectory=runtime
connector.pollInterval=PT2S
connector.heartbeatInterval=PT1M
connector.claimLimit=20
connector.leaseSeconds=90

